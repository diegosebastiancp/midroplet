<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .btn-agregar {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div id="map"></div>

<button class="btn btn-dark btn-agregar shadow"
        data-bs-toggle="modal"
        data-bs-target="#modalUbicacion">
    +
</button>

<div class="modal fade" id="modalUbicacion" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Nueva ubicación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Latitud</label>
                        {{ form.latitud }}
                        {{ form.latitud.errors }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Longitud</label>
                        {{ form.longitud }}
                        {{ form.longitud.errors }}
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Guardar
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var map = L.map('map', {
        zoomSnap: 1,
        zoomDelta: 1
    }).setView([-33.4489, -70.6693], 10);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    {% for u in ubicaciones %}
        L.marker([
            {{ u.latitud }},
            {{ u.longitud }}
        ]).addTo(map)
        .bindPopup(
            'ID: {{ u.id_ubi }}<br>' +
            'Lat: {{ u.latitud }}<br>' +
            'Lon: {{ u.longitud }}'
        );
    {% endfor %}
</script>

</body>
</html>
